<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Column Check</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #273449; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --primary: #38bdf8;
    --ok: #22c55e; --missing: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 28px; line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: var(--primary); }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 0.92rem; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

  .drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 22px;
    text-align: center; cursor: pointer; background: var(--panel-2);
    transition: all 0.2s;
  }
  .drop:hover { border-color: var(--primary); }
  .drop.dragover { border-color: var(--primary); background: #1e3a5f; }
  .drop.has-file { border-color: var(--ok); border-style: solid; background: #0f2e1a; }
  .drop input { display: none; }
  .drop .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .drop .name { font-weight: 600; margin-top: 8px; word-break: break-all; }
  .drop .meta { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

  .opts {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px;
  }
  .opt {
    display: flex; align-items: center; gap: 7px; padding: 8px 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 0.85rem; cursor: pointer; user-select: none;
  }
  .opt input { accent-color: var(--primary); }

  button.primary {
    background: linear-gradient(90deg, #38bdf8, #818cf8); color: #0b1220;
    font-weight: 700; border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 1rem; cursor: pointer; width: 100%;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 0.85rem;
  }
  button.ghost:hover { border-color: var(--primary); color: var(--primary); }

  #results { display: none; }

  .verdict {
    padding: 18px; border-radius: 10px; font-size: 1.05rem;
    margin-bottom: 16px; font-weight: 600;
  }
  .verdict.ok { background: #0f2e1a; border-left: 5px solid var(--ok); color: #bbf7d0; }
  .verdict.fail { background: #2e0f0f; border-left: 5px solid var(--missing); color: #fecaca; }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .stat {
    background: var(--panel-2); border: 1px solid var(--border);
    border-left: 4px solid var(--primary); border-radius: 8px; padding: 12px 14px;
  }
  .stat.ok { border-left-color: var(--ok); }
  .stat.missing { border-left-color: var(--missing); }
  .stat .num { font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .stat.ok .num { color: var(--ok); }
  .stat.missing .num { color: var(--missing); }
  .stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }

  .missing-section h3 {
    margin: 0 0 12px; font-size: 0.9rem; color: var(--missing);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 6px 12px; border-radius: 6px; font-size: 0.88rem;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b;
  }
  .chip.ok {
    background: #14532d; color: #bbf7d0; border-color: #166534;
  }

  details.raw {
    margin-top: 14px; background: var(--panel-2); border-radius: 6px; padding: 10px 14px;
  }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  details.raw pre { margin: 10px 0 0; font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2); border-top-color: #0b1220;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 4px solid var(--primary); padding: 12px 18px;
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    font-size: 0.9rem; opacity: 0; transform: translateY(10px);
    transition: all 0.25s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-left-color: var(--missing); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Global Column Check</h1>
  <p class="sub">Does every column anywhere in the Primary file exist anywhere in the Secondary file? That's it. No sheets, no tables.</p>

  <div class="card">
    <div class="grid-2">
      <label class="drop" id="dropPrimary">
        <input type="file" id="primaryFile" accept=".zip,.xlsx,.xls,.csv">
        <div class="label">Primary File</div>
        <div class="name" id="primaryName">Click or drop…</div>
        <div class="meta" id="primaryMeta"></div>
      </label>
      <label class="drop" id="dropSecondary">
        <input type="file" id="secondaryFile" accept=".zip,.xlsx,.xls,.csv">
        <div class="label">Secondary File</div>
        <div class="name" id="secondaryName">Click or drop…</div>
        <div class="meta" id="secondaryMeta"></div>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="opts">
      <label class="opt"><input type="checkbox" id="optCase" checked> Ignore case (Name = name)</label>
      <label class="opt"><input type="checkbox" id="optSpace" checked> Ignore spaces/underscores (First Name = first_name)</label>
    </div>
  </div>

  <div class="card">
    <button class="primary" id="runBtn" disabled>▶ Check Columns</button>
    <div id="status" style="text-align:center; margin-top:10px; color:var(--muted); font-size:0.85rem;"></div>
  </div>

  <div id="results">
    <div class="card">
      <div id="verdict" class="verdict"></div>
      <div class="stat-row" id="statRow"></div>
      <div class="missing-section" id="missingSection"></div>
      <div style="margin-top:14px">
        <button class="ghost" id="exportBtn">⬇ Copy missing list</button>
      </div>
    </div>
    <div class="card">
      <details class="raw">
        <summary>All primary columns (click to expand)</summary>
        <div class="chips" id="allPrimaryChips" style="margin-top:10px"></div>
      </details>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
const state = { primary: null, secondary: null };
const $ = id => document.getElementById(id);

/* ---------- File handling ---------- */
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(2) + ' MB';
}

async function handleFile(file, which) {
  if (!file) return;
  const nameEl = which === 'primary' ? $('primaryName') : $('secondaryName');
  const metaEl = which === 'primary' ? $('primaryMeta') : $('secondaryMeta');
  const dropEl = which === 'primary' ? $('dropPrimary') : $('dropSecondary');

  nameEl.textContent = file.name;
  metaEl.textContent = fmtSize(file.size) + ' · parsing…';

  try {
    const cols = await extractAllColumns(file);
    state[which] = { fileName: file.name, columns: cols };
    metaEl.textContent = fmtSize(file.size) + ' · ' + cols.length + ' unique column(s)';
    dropEl.classList.add('has-file');
  } catch (e) {
    metaEl.textContent = '❌ ' + e.message;
    dropEl.classList.remove('has-file');
    state[which] = null;
    toast('Error: ' + e.message, true);
    console.error(e);
  }
  $('runBtn').disabled = !(state.primary && state.secondary);
}

$('primaryFile').addEventListener('change', e => handleFile(e.target.files[0], 'primary'));
$('secondaryFile').addEventListener('change', e => handleFile(e.target.files[0], 'secondary'));

['dropPrimary', 'dropSecondary'].forEach(id => {
  const el = $(id);
  const which = id === 'dropPrimary' ? 'primary' : 'secondary';
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], which);
  });
});

/* ---------- Extract ALL columns from a file (any format, any nesting) ---------- */
async function extractAllColumns(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const set = new Set();

  if (ext === 'zip') {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const entries = [];
    zip.forEach((path, entry) => {
      if (entry.dir) return;
      if (path.startsWith('__MACOSX/') || path.includes('.DS_Store')) return;
      const e = path.split('.').pop().toLowerCase();
      if (['xlsx','xls','csv'].includes(e)) entries.push({ path, entry });
    });
    if (!entries.length) throw new Error('No Excel/CSV files inside ZIP');

    for (const { path, entry } of entries) {
      const e = path.split('.').pop().toLowerCase();
      const blob = await entry.async('blob');
      const f = new File([blob], path.split('/').pop());
      const cols = e === 'csv' ? await colsFromCSV(f) : await colsFromExcel(f);
      cols.forEach(c => set.add(c));
    }
  } else if (ext === 'csv') {
    (await colsFromCSV(file)).forEach(c => set.add(c));
  } else if (ext === 'xlsx' || ext === 'xls') {
    (await colsFromExcel(file)).forEach(c => set.add(c));
  } else {
    throw new Error('Unsupported: .' + ext);
  }

  return [...set];
}

function colsFromCSV(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      skipEmptyLines: 'greedy',
      complete: r => {
        if (!r.data.length) return resolve([]);
        const headers = r.data[0].map(h => String(h == null ? '' : h).trim()).filter(Boolean);
        resolve(headers);
      },
      error: reject,
    });
  });
}

function colsFromExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const cols = [];
        wb.SheetNames.forEach(sn => {
          const json = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: false });
          if (json.length) {
            json[0].forEach(h => {
              const v = String(h == null ? '' : h).trim();
              if (v) cols.push(v);
            });
          }
        });
        resolve(cols);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- Normalization ---------- */
function norm(name, opts) {
  let s = String(name).trim();
  if (opts.case) s = s.toLowerCase();
  if (opts.space) s = s.replace(/[\s_\-]+/g, '');
  return s;
}

/* ---------- Run comparison ---------- */
$('runBtn').addEventListener('click', () => {
  const btn = $('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Checking…';

  setTimeout(() => {
    try {
      const opts = { case: $('optCase').checked, space: $('optSpace').checked };

      // Normalize secondary into a Set for O(1) lookup
      const secondarySet = new Set(state.secondary.columns.map(c => norm(c, opts)));

      // Build unique primary columns (normalized) but keep original display name
      const primaryUnique = new Map(); // normKey -> originalName
      state.primary.columns.forEach(c => {
        const k = norm(c, opts);
        if (!primaryUnique.has(k)) primaryUnique.set(k, c);
      });

      const missing = [];
      const matched = [];
      primaryUnique.forEach((origName, k) => {
        if (secondarySet.has(k)) matched.push(origName);
        else missing.push(origName);
      });

      render({
        primaryTotal: state.primary.columns.length,
        primaryUnique: primaryUnique.size,
        secondaryUnique: secondarySet.size,
        matched: matched.length,
        missing,
        allPrimary: [...primaryUnique.values()],
        matchedList: matched,
      });
    } catch (e) {
      toast('Error: ' + e.message, true);
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '▶ Check Columns';
    }
  }, 20);
});

/* ---------- Render ---------- */
function render(r) {
  $('results').style.display = 'block';
  $('status').textContent = '✔ Done at ' + new Date().toLocaleTimeString();

  const verdict = $('verdict');
  if (r.missing.length === 0) {
    verdict.className = 'verdict ok';
    verdict.innerHTML = '✅ <strong>PASS</strong> — every column in the primary file exists in the secondary file.';
  } else {
    verdict.className = 'verdict fail';
    verdict.innerHTML = `❌ <strong>FAIL</strong> — ${r.missing.length} column(s) in the primary file are <u>missing</u> from the secondary file.`;
  }

  $('statRow').innerHTML = `
    <div class="stat"><div class="num">${r.primaryUnique}</div><div class="lbl">Unique cols in primary</div></div>
    <div class="stat"><div class="num">${r.secondaryUnique}</div><div class="lbl">Unique cols in secondary</div></div>
    <div class="stat ok"><div class="num">${r.matched}</div><div class="lbl">Matched</div></div>
    <div class="stat missing"><div class="num">${r.missing.length}</div><div class="lbl">Missing</div></div>
  `;

  const ms = $('missingSection');
  if (r.missing.length === 0) {
    ms.innerHTML = '';
  } else {
    ms.innerHTML = `
      <h3>⚠ Missing columns (present in Primary, absent in Secondary)</h3>
      <div class="chips">${r.missing.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
    `;
  }

  $('allPrimaryChips').innerHTML = r.allPrimary.map(c => {
    const isMissing = r.missing.includes(c);
    return `<span class="chip ${isMissing ? '' : 'ok'}">${esc(c)}</span>`;
  }).join('');

  window._missing = r.missing;
}

$('exportBtn').addEventListener('click', () => {
  const list = window._missing || [];
  if (!list.length) { toast('Nothing missing to copy 🎉'); return; }
  navigator.clipboard.writeText(list.join('\n')).then(() => toast('Missing column list copied.'));
});

/* ---------- Utils ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', isErr);
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
</body>
</html>
